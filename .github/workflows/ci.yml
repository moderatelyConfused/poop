name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  exe:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2
    - uses: mlugg/setup-zig@v2
      with:
        version: master

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

    - name: Archive executable
      uses: actions/upload-artifact@v4
      with:
        name: poop
        path: zig-out/bin/*
